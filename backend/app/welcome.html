<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绩效管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; }
        .container { max-width: 480px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
        .btn {
            display: inline-block; padding: 12px 32px; background: #07c160; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
            text-decoration: none; transition: background 0.2s;
        }
        .btn:hover { background: #06ad56; }
        .status { margin-top: 24px; padding: 16px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .status p { color: #333; font-size: 14px; line-height: 1.8; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .badge-ok { background: #e6f7e9; color: #07c160; }
        .badge-wait { background: #fff7e6; color: #fa8c16; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📊</div>
        <h1>绩效管理系统</h1>
        <p class="subtitle">企业微信自动化绩效管理平台</p>

        <div id="userInfo" style="display:none;">
            <div class="status">
                <p>👤 <strong id="userName"></strong></p>
                <p>🏢 <span id="userDept"></span></p>
                <p>💼 <span id="userPosition"></span></p>
                <p>🔑 <span class="badge badge-ok" id="userRole"></span></p>
            </div>
        </div>

        <a href="/auth/login" class="btn" id="loginBtn">企业微信登录</a>

        <div class="status" style="margin-top: 16px;">
            <p>
                后端状态：<span class="badge badge-ok" id="apiStatus">检测中...</span>
            </p>
        </div>
    </div>

    <script>
        // 检查 API 状态
        fetch('/health')
            .then(r => r.json())
            .then(data => {
                document.getElementById('apiStatus').textContent = 'API 正常';
                document.getElementById('apiStatus').className = 'badge badge-ok';
            })
            .catch(() => {
                document.getElementById('apiStatus').textContent = 'API 未连接';
                document.getElementById('apiStatus').className = 'badge badge-wait';
            });

        // 检查是否已登录
        const token = new URLSearchParams(window.location.search).get('token') ||
                       document.cookie.replace(/(?:(?:^|.*;\s*)token\s*\=\s*([^;]*).*$)|^.*$/, "$1");
        if (token) {
            fetch('/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => {
                if (data.id) {
                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('userName').textContent = data.name;
                    document.getElementById('userDept').textContent = data.dept_name || '未分配部门';
                    document.getElementById('userPosition').textContent = data.position || '未设置';
                    document.getElementById('userRole').textContent =
                        data.role === 'manager' ? '管理者' : data.role === 'hr' ? 'HR' : '员工';
                    document.getElementById('loginBtn').style.display = 'none';
                }
            })
            .catch(() => {});
        }
    </script>
</body>
</html>
